name: Compile Modded Android Init
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-init:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout My Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true

      - name: Setup repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync AOSP Source (Auto Search Mode)
        run: |
          mkdir -p aosp
          cd aosp
          repo init -u https://android.googlesource.com/platform/manifest -b android-12.0.0_r1 --depth=1
          
          # 🚨 核心思路：拉取 system 下的几个顶级大包，以及构建系统
          # 这样 compiler 就能在本地直接搜索依赖，不会报 project not found
          repo sync -c --no-tags --no-clone-bundle -j$(nproc) \
            platform/system/core \
            platform/system/libbase \
            platform/system/logging \
            platform/system/sepolicy \
            platform/system/extras \
            platform/build/soong \
            platform/build/blueprint \
            platform/prebuilts/clang/host/linux-x86 \
            platform/prebuilts/build-tools

      - name: Apply Patch From Repo (Python Magic)
        run: |
          cd aosp
          # 替换咱们魔改的源码
          cp ../init_patch_src/first_stage_init.cpp system/core/init/first_stage_init.cpp
          echo "✅ 魔改源码替换成功！"

      - name: Build Init
        run: |
          cd aosp
          # 🚨 核心：允许缺失依赖，让它自己去搜！
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh || true
          lunch aosp_arm64-userdebug || true
          # 直接调用 soong 编译 init
          m init -j$(nproc)

      - name: Upload Modded Init to Releases
        if: always()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: init-build-${{ github.run_number }}
          name: Modded Init Build ${{ github.run_number }}
          files: |
            aosp/out/target/product/generic_arm64/system/bin/init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
