name: Compile Modded Android Init
on:
  workflow_dispatch:

permissions:
  contents: write # 🚨 必须给写入权限才能传 Releases

jobs:
  build-init:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true

      - name: Setup repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync AOSP Source (Partial)
        run: |
          sudo mkdir -p /mnt/aosp
          sudo chown -R $USER:$USER /mnt/aosp
          ln -s /mnt/aosp aosp
          cd aosp
          repo init -u https://android.googlesource.com/platform/manifest -b android-12.0.0_r1 --depth=1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc) \
            platform/system/core \
            platform/system/libbase \
            platform/system/logging \
            platform/system/libcutils \
            platform/system/libselinux \
            platform/system/sepolicy \
            platform/build/soong \
            platform/build/make \
            platform/prebuilts/clang/host/linux-x86 \
            platform/prebuilts/build-tools

      - name: Patch Init Source Code (Idempotent Mount Magic)
        run: |
          cd /mnt/aosp
          cat > patch_init.py << 'PYEOF'
          import os
          import re

          def patch_file(filepath):
              if not os.path.exists(filepath): return
              with open(filepath, 'r') as f:
                  content = f.read()

              # 1. 致命错误降级
              content = content.replace('LOG(FATAL)', 'LOG(WARNING)')
              content = content.replace('PLOG(FATAL)', 'PLOG(WARNING)')
              
              # 2. 暴力解除 abort
              content = content.replace('abort();', '/* abort disabled */')
              content = content.replace('return false;', 'return true; /* ignored */')
              
              # 3. 宽容挂载失败
              pattern = r'if\s*\(\s*(mount\s*\([^;]+?\))\s*!=\s*0\s*\)'
              replacement = r'if (\1 != 0 && errno != EBUSY && errno != ENOENT)'
              content = re.sub(pattern, replacement, content)

              # 4. 强行无视 sysfs 挂载失败
              content = re.sub(r'if\s*\(\s*mount\(\s*"sysfs",\s*"/sys".*?\)\s*<\s*0\s*\)', 
                               'if (false) /* ignore sysfs mount error */', content)

              with open(filepath, 'w') as f:
                  f.write(content)
              print(f"✅ 已修补: {filepath}")

          print(">>> 开始对 init 源码打补丁...")
          patch_file('system/core/init/first_stage_init.cpp')
          patch_file('system/core/init/first_stage_mount.cpp')
          patch_file('system/core/init/init.cpp')
          print(">>> 补丁全部注入成功！")
          PYEOF
          
          python3 patch_init.py

      - name: Build Init
        run: |
          cd /mnt/aosp
          source build/envsetup.sh
          lunch aosp_arm64-userdebug
          m init -j$(nproc)

      # 🚨 核心：强行打包上传到 Releases！
      - name: Upload Modded Init to Releases
        if: always()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: init-build-${{ github.run_number }}
          name: Modded Init Build ${{ github.run_number }}
          # 把编译出来的 init 放进去，顺便把你想要的挂载表也写一份放在一起
          files: |
            /mnt/aosp/out/target/product/generic_arm64/system/bin/init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
