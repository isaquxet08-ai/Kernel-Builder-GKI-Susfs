name: Universal GKI Kernel Builder CI
run-name: "Build Custom GKI: ${{ inputs.build_name }} [${{ github.ref_name }}]"
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Build Name (构建名称)"
        required: true
        type: string
        default: "android12-5.10"
      target_version:
        description: "Kernel Version (内核版本)"
        required: true
        type: string
        default: "5.10.272"
      root_manager:
        description: "Root Environment (Root 管理器)"
        required: true
        type: choice
        options:
          - Stock
          - KernelSU
          - KernelSU-Next
          - SukiSU-Ultra
          - BakaSU
      enable_ksu_susfs:
        description: "Integrate SUSFS? (是否集成SUSFS)"
        required: false
        type: boolean
        default: false
      # 🚨 我们的自定义模块选项
      build_type:
        description: 'Build Type (编译模式)'
        required: true
        type: choice
        default: 'base'
        options:
          - base        # 基础组（只保留 VirtIO，砍掉实体硬件）
          - full        # 完整版（全量编译）
      enable_wlan:
        description: 'Enable WLAN/Wi-Fi? (是否保留实体Wi-Fi模块)'
        required: false
        type: boolean
        default: false
      enable_bt:
        description: 'Enable Bluetooth? (是否保留蓝牙模块)'
        required: false
        type: boolean
        default: false
      enable_gpu:
        description: 'Enable Physical GPU? (是否保留AMD/Intel显卡)'
        required: false
        type: boolean
        default: false
      enable_media:
        description: 'Enable Media/Sound? (是否保留电视卡/声卡)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Create 16GB Swap
        run: |
          sudo swapoff -a
          if [ -f /swapfile ]; then sudo rm -f /swapfile; fi
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Fetch Offline Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libelf-dev zlib1g-dev libssl-dev bc dwarves pahole bison flex

      - name: Setup repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync kernel source (Mount to /mnt)
        run: |
          sudo mkdir -p /mnt/workspace
          sudo chown -R $USER:$USER /mnt/workspace
          ln -s /mnt/workspace kernel_workspace
          
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b "common-android12-5.10-lts" --depth=1
          repo sync -c --no-tags --no-clone-bundle --current-branch -j$(nproc)
          cd common
          echo "OFFICIAL_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "OFFICIAL_DATE=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Build Kernel
        env:
          BASE_VER: "5.10"
          BUILD_TYPE: ${{ inputs.build_type }}
          ENABLE_WLAN: ${{ inputs.enable_wlan }}
          ENABLE_BT: ${{ inputs.enable_bt }}
          ENABLE_GPU: ${{ inputs.enable_gpu }}
          ENABLE_MEDIA: ${{ inputs.enable_media }}
          ROOT_MANAGER: ${{ inputs.root_manager }}
        run: |
          cd $GITHUB_WORKSPACE
          # 如果选了非 Stock 版本，可以在这里预留注入 KSU 的脚本位置
          # if [ "$ROOT_MANAGER" != "Stock" ]; then ... fi
          
          bash ./scripts/build_kernel.sh

      - name: Prepare Final Artifacts
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p out/final
          IMG=$(find /mnt/workspace $GITHUB_WORKSPACE -name "Image" -type f 2>/dev/null | head -n 1)
          SYMVERS=$(find /mnt/workspace $GITHUB_WORKSPACE -name "Module.symvers" -type f 2>/dev/null | head -n 1)
          
          if [ -n "$IMG" ]; then
              echo "✅ 捞到 Image: $IMG"
              cp "$IMG" out/final/Image
              git clone --depth=1 -b "master" "https://github.com/shoey63/AnyKernel3.git" AK3
              cp -f "$IMG" AK3/
              cd AK3 && zip -r9 "../out/final/Rescued-AK3.zip" * && cd ..
          fi
          
          if [ -n "$SYMVERS" ]; then
              echo "✅ 捞到符号表: $SYMVERS"
              cp "$SYMVERS" out/final/Module.symvers
          fi

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: always()
        with:
          tag_name: build-${{ github.run_number }}-force
          files: out/final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
