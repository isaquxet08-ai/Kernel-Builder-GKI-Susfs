name: Compile Modded Android Init
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-init:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout My Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true

      - name: Setup repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync AOSP Source & Toolchain
        run: |
          mkdir -p aosp
          cd aosp
          repo init -u https://android.googlesource.com/platform/manifest -b android-12.0.0_r1 --depth=1
          repo sync -c --no-tags --no-clone-bundle -j$(nproc) \
            platform/system/core \
            platform/system/libbase \
            platform/system/logging \
            platform/system/sepolicy \
            platform/system/extras \
            platform/build/soong \
            platform/build/blueprint \
            platform/prebuilts/clang/host/linux-x86 \
            platform/prebuilts/build-tools

      # 🚨 核心魔法：直接在云端用 cat 覆盖一个超级补丁脚本
      - name: Apply Cat Patch Script
        run: |
          cd aosp
          # 写一个叫 fix_init.sh 的脚本，用 sed 替换掉会崩溃的代码
          cat > fix_init.sh << 'PATCH_EOF'
          #!/bin/bash
          echo ">>> 正在执行物理超度..."
          # 1. 把所有 fatal 降级
          sed -i 's/LOG(FATAL)/LOG(WARNING)/g' system/core/init/first_stage_init.cpp
          sed -i 's/LOG(FATAL)/LOG(WARNING)/g' system/core/init/first_stage_mount.cpp
          sed -i 's/LOG(FATAL)/LOG(WARNING)/g' system/core/init/init.cpp
          
          # 2. 把 abort() 和 return false 直接干掉
          sed -i 's/abort();/;/g' system/core/init/first_stage_init.cpp
          sed -i 's/return false;/return true;/g' system/core/init/first_stage_init.cpp
          
          echo ">>> 补丁打完了，准备编译！"
          PATCH_EOF

          chmod +x fix_init.sh
          ./fix_init.sh

      - name: Build Init
        run: |
          cd aosp
          # 允许缺失依赖，强制编译
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh || true
          lunch aosp_arm64-userdebug || true
          m init -j$(nproc)

      - name: Find and Upload Modded Init
        if: always()
        run: |
          cd aosp
          INIT_PATH=$(find out/ -name "init" -type f | grep -v "\.o" | head -n 1)
          if [ -n "$INIT_PATH" ]; then
            echo "✅ 找到编译好的 init: $INIT_PATH"
            cp "$INIT_PATH" ./modded_init_binary
            chmod 755 ./modded_init_binary
            gh release create init-build-${{ github.run_number }} ./modded_init_binary --title "Init Build ${{ github.run_number }}" || true
            gh release upload init-build-${{ github.run_number }} ./modded_init_binary --clobber || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
