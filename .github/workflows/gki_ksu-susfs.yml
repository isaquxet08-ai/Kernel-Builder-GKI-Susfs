name: Universal GKI Kernel Builder CI
run-name: "Build Custom GKI: ${{ inputs.build_name }} [${{ github.ref_name }}]"
on:
  workflow_dispatch:
    inputs:
      build_name:
        required: true
        default: "android12-5.10"
      target_version:
        required: true
        default: "5.10.272"
      root_manager:
        required: true
        type: choice
        options:
          - Stock
          - KernelSU
          - KernelSU-Next

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Create 16GB Swap
        run: |
          sudo swapoff -a
          if [ -f /swapfile ]; then sudo rm -f /swapfile; fi
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # 🚨 核心回归：强制拉取你专属的离线依赖包
      - name: Fetch Offline Deps from Custom Repo
        run: |
          echo ">>> 正在从专属预编译仓库拉取全量依赖..."
          wget -q https://github.com/isaquxet08-ai/Kernel-Deps/releases/latest/download/kernel_deps_full.tar.gz || echo "Fallback to apt"
          if [ -f kernel_deps_full.tar.gz ]; then
            tar -xzf kernel_deps_full.tar.gz
            sudo dpkg -i offline_debs/*.deb || sudo apt-get install -f -y
          fi
          echo ">>> 在线补齐核心依赖，防止 22.04 缺库..."
          sudo apt-get update -qq
          sudo apt-get install -y libelf-dev zlib1g-dev libssl-dev bc dwarves pahole bison flex

      - name: Setup repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync kernel source (Mount to /mnt)
        run: |
          sudo mkdir -p /mnt/workspace
          sudo chown -R $USER:$USER /mnt/workspace
          ln -s /mnt/workspace kernel_workspace
          
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b "common-android12-5.10-lts" --depth=1
          repo sync -c --no-tags --no-clone-bundle --current-branch -j$(nproc)
          cd common
          echo "OFFICIAL_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "OFFICIAL_DATE=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Build Kernel
        env:
          BASE_VER: "5.10"
        run: |
          cd $GITHUB_WORKSPACE
          bash ./scripts/build_kernel.sh

      - name: Prepare Final Artifacts
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p out/final
          IMG=$(find /mnt/workspace $GITHUB_WORKSPACE -name "Image" -type f 2>/dev/null | head -n 1)
          SYMVERS=$(find /mnt/workspace $GITHUB_WORKSPACE -name "Module.symvers" -type f 2>/dev/null | head -n 1)
          
          if [ -n "$IMG" ]; then
              echo "✅ 捞到 Image: $IMG"
              cp "$IMG" out/final/Image
              git clone --depth=1 -b "master" "https://github.com/shoey63/AnyKernel3.git" AK3
              cp -f "$IMG" AK3/
              cd AK3 && zip -r9 "../out/final/Rescued-AK3.zip" * && cd ..
          fi
          
          if [ -n "$SYMVERS" ]; then
              echo "✅ 捞到符号表: $SYMVERS"
              cp "$SYMVERS" out/final/Module.symvers
          fi

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: always()
        with:
          tag_name: build-${{ github.run_number }}-force
          files: out/final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
